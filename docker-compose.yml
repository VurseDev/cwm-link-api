version: '3.8'

services:
  # PostgreSQL for Auth Service
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cwm_link_auth
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Auth Service (Elysia + Better Auth)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@auth-db:5432/cwm_link_auth
      PORT: 3001
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ./auth-service:/app
      - /app/node_modules

  # NestJS API (existing)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cwm_link
      AUTH_SERVICE_URL: http://auth-service:3001
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  auth-db-data:
